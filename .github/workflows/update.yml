
name: Refresh My IPTV Auto Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-iptv-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Build updated playlist
      - name: Build playlist
        run: |
          python scripts/build.py

      # 5. Check generated playlist
      - name: Verify playlist
        run: |
          if [ ! -s playlist.m3u ]; then
            echo "ERROR: playlist.m3u is missing or empty"
            exit 1
          fi

          echo "Playlist generated successfully"
          echo "Total lines:"
          wc -l playlist.m3u

          echo "Channel count:"
          grep -c '^#EXTINF:' playlist.m3u || true

      # 6. Commit and safely push changes
      - name: Commit and push updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update IPTV playlist"

          git pull --rebase origin main

          git push origin HEAD:main
